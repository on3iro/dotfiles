[settings]
experimental = true
idiomatic_version_file_enable_tools = ["flutter", "node"]
jobs = 8
lockfile = true

[tools]
flutter = "latest"
"go:github.com/jonaslu/ain/cmd/ain" = "latest"
golangci-lint = "latest"
gum = "latest"
htmlq = "latest"
lnav = "latest"
node = "latest"
"npm:httpyac" = "latest"
python = "3.12"
ruby = "latest"
superhtml = "latest"
yarn = "latest"
yq = "latest"
# "ubi:adwinying/php" = "8.4"

# --- migrated from nix-darwin (Phase 1) ---
ansible = "latest" # version mismatch: nix reported ansible-core 2.21.3, not the pipx `ansible` package version
atuin = "latest"
bat = "latest"
bottom = "latest"
dbmate = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
git-lfs = "latest"
herdr = "latest"
just = "latest"
lazygit = "latest"
lua = "5.2.4" # no aqua backend (vfox/asdf plugin, builds from source) - confirm this resolves, else fall back to brew:lua
marksman = "2026-02-08" # date-based pseudo-version; confirm "latest" aliasing works for this backend before switching
neovim = "latest"
restic = "latest"
ripgrep = "latest"
sd = "latest"
starship = "latest"
tree-sitter = "latest"
usage = "latest"
yazi = "latest"
zellij = "latest"
zoxide = "latest"

[bootstrap.packages]
# --- migrated from nix-darwin environment.systemPackages (Phase 3) ---
# not in mise's [tools] registry - see Phase 1 registry check
"brew:ack" = "latest"
"brew:rusty-ferris-club/tap/shellclear" = "latest" # not in homebrew-core, own tap
"brew:httpie" = "latest"
"brew:nmap" = "latest"
"brew:universal-ctags" = "latest"
"brew:imagemagick" = "latest" # also failed as a mise [tools] entry (conda backend, no exact version match)
"brew:clipboard" = "latest" # was nix's clipboard-jh; same binary (cb), confirmed real Homebrew formula
# aerospace intentionally NOT here: nikitabobko/tap doesn't publish cask API metadata,
# and mise's cask DSL evaluator errors on `staged_path` in its postflight block.
# install manually instead: brew install --cask nikitabobko/tap/aerospace
"brew-cask:pika" = "latest"
"brew-cask:android-commandlinetools" = "latest"
# chromium intentionally NOT here: cask disabled by Homebrew since 2026-09-01
# (fails_gatekeeper_check). Install some other way for now; revisit once re-enabled.

[bootstrap.macos.defaults."com.apple.dock"]
# --- migrated from nix-darwin system.defaults.dock (Phase 2) ---
# domain/key mapping verified against nix-darwin's modules/system/defaults-write.nix
autohide = true
launchanim = false
magnification = false
mineffect = "scale"
orientation = "right"
"static-only" = true
"expose-group-apps" = true
"mru-spaces" = false
"wvous-bl-corner" = 1
"wvous-br-corner" = 1
"wvous-tl-corner" = 1
"wvous-tr-corner" = 1
# persistent-apps/persistent-others intentionally NOT migrated: nix-darwin builds these
# as nested tile-data plist structures via custom logic, not simple key/value writes.
# Confirmed current Dock already has no pinned apps, matching persistent-apps = [].
# If you want the Applications-folder shortcut back, add it manually (drag into Dock).

[bootstrap.macos.defaults."com.apple.finder"]
FXPreferredViewStyle = "icnv"
AppleShowAllExtensions = true
AppleShowAllFiles = true
ShowPathbar = true
ShowStatusBar = true
_FXShowPosixPathInTitle = true
_FXSortFoldersFirst = true

[bootstrap.macos.defaults."com.apple.screencapture"]
location = "~/Pictures/screenshots"

[bootstrap.macos.defaults.NSGlobalDomain]
AppleICUForce24HourTime = true
AppleInterfaceStyle = "Dark"
AppleShowAllFiles = true
AppleShowScrollBars = "Automatic"
NSAutomaticCapitalizationEnabled = false
NSAutomaticSpellingCorrectionEnabled = false
"com.apple.keyboard.fnState" = false
"com.apple.swipescrolldirection" = false
# caps-lock remap (system.keyboard.remapCapsLockToEscape) intentionally NOT migrated -
# confirmed no replacement needed, will be re-set manually in System Settings if desired.

[tasks.klaus]
dir = "{{cwd}}"
run = """
claude-safe --add-dirs-ro=/etc/gitconfig:/Users/theo/.gitconfig --allow-localhost=47657 --env-pass=HERDR_ENV,HERDR_PANE_ID,HERDR_SOCKET_PATH --add-dirs="$HOME/Library/Application Support/tuicr"
"""
